# Adapted from ungoogled-chromium-windows (BSD-3-Clause).
name: Prepare build environment
description: Set up Python, copy the checkout to a short path, install stage dependencies
inputs:
  python-version:
    description: Python version
    required: false
    default: '3.12'
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    # GN bakes `python3` from PATH into its rules; on Windows that is the Store
    # alias unless a real python3.exe comes first.
    - name: Provide python3.exe
      shell: pwsh
      run: |
        $python3 = Join-Path $env:pythonLocation 'python3.exe'
        if (-not (Test-Path $python3)) {
          Copy-Item (Join-Path $env:pythonLocation 'python.exe') $python3
        }
        python3 --version

    # Chromium paths are deep; a short root keeps them under Windows limits.
    # The build needs no git metadata, and the stage action runs from the
    # checkout itself. robocopy exits below 8 on success.
    - name: Copy checkout to C:\a
      shell: pwsh
      run: |
        robocopy . 'C:\a' /E /MT:16 /XD .git .github /XF .git /NFL /NDL /NJH /NJS /NP
        if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
        exit 0

    - name: Cache stage dependencies
      id: node-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./.github/actions/stage/node_modules
        key: stage-node-modules-${{ runner.os }}-${{ hashFiles('.github/actions/stage/package-lock.json') }}

    - name: Install stage dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: pwsh
      run: npm ci
      working-directory: ./.github/actions/stage

    - name: Install Windows SDK 10.0.28000.0
      shell: pwsh
      run: |
        if (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0') {
          Write-Host 'SDK 10.0.28000.0 already installed.'
          exit 0
        }
        $installer = "$env:TEMP\winsdksetup.exe"
        Invoke-WebRequest -Uri 'https://download.microsoft.com/download/38ab8f6d-3676-4860-ae84-3361308b9d7f/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $installer
        # Run it only if Microsoft signed it.
        $signature = Get-AuthenticodeSignature $installer
        if ($signature.Status -ne 'Valid' -or
            $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
          throw "winsdksetup.exe is not signed by Microsoft: $($signature.Status)"
        }
        $features = '/features OptionId.DesktopCPPx64 OptionId.DesktopCPPx86 OptionId.DesktopCPPArm64 OptionId.WindowsDesktopDebuggers OptionId.UWPCPP OptionId.SigningTools /q /norestart /ceip off'
        $proc = Start-Process -FilePath $installer -ArgumentList $features -PassThru -Wait
        if ($proc.ExitCode -ne 0) { throw "winsdksetup.exe failed with code $($proc.ExitCode)" }
        if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0')) {
          throw 'SDK 10.0.28000.0 not found after install.'
        }
